[project]
name = "nutrialiment-api"
version = "0.1.0"
description = "FastAPI backend for the NutriAliment nutrition lead-conversion product"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.128.0",
  "httpx>=0.28.1",
  "pytest>=9.0.2",
  "reportlab>=4.0",
  "pymupdf>=1.24",
  "uvicorn[standard]>=0.38.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

